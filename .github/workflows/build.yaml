name: Build plugin

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show versions
        run: mvn -v

      # -B: batch mode, -ntp: no download progress noise, -e: full stack traces on errors
      - name: Build and test
        run: mvn -B -ntp -e clean verify

      - name: Upload plugin (.hpi)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-pipeline-stages-hpi
          path: target/*.hpi
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/spotbugsXml.xml
          if-no-files-found: ignore
          retention-days: 14
